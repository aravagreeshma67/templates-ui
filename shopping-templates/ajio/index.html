<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AJIO - Fashion Store</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">

        <div class="logo">AJIO</div>

        <nav>
            <a href="#">MEN</a>
            <a href="#">WOMEN</a>
            <a href="#">KIDS</a>
            <a href="#">BEAUTY</a>
            <a href="#">HOME</a>
        </nav>

        <div class="search-box">
            <input
                type="text"
                id="searchInput"
                placeholder="Search AJIO"
            >
        </div>

        <div class="header-buttons">

            <button onclick="showMessage('Profile clicked')">
                👤
            </button>

            <button onclick="showMessage('Wishlist clicked')">
                ♡
            </button>

            <button onclick="openCart()">
                🛍️ <span id="cartCount">0</span>
            </button>

        </div>

    </header>


    <!-- HERO -->
    <section class="hero">

        <div class="hero-content">

            <p>THE NEW SEASON</p>

            <h1>STYLE YOUR WAY</h1>

            <p>Discover fashion made for you</p>

            <button onclick="scrollToProducts()">
                SHOP NOW
            </button>

        </div>

    </section>


    <!-- CATEGORY SECTION -->
    <section class="categories">

        <h2>SHOP BY CATEGORY</h2>

        <div class="category-buttons">

            <button onclick="filterProducts('all')">
                ALL
            </button>

            <button onclick="filterProducts('women')">
                WOMEN
            </button>

            <button onclick="filterProducts('men')">
                MEN
            </button>

            <button onclick="filterProducts('footwear')">
                FOOTWEAR
            </button>

            <button onclick="filterProducts('accessories')">
                ACCESSORIES
            </button>

        </div>

    </section>


    <!-- PRODUCTS -->
    <main id="productsSection" class="products-section">

        <h2>NEW ARRIVALS</h2>

        <div
            id="productGrid"
            class="product-grid">
        </div>

    </main>


    <!-- CART OVERLAY -->
    <div
        id="overlay"
        class="overlay"
        onclick="closeCart()">
    </div>


    <!-- CART -->
    <aside id="cart" class="cart">

        <div class="cart-header">

            <h2>Your Bag</h2>

            <button onclick="closeCart()">
                ✕
            </button>

        </div>

        <div id="cartItems" class="cart-items"></div>

        <div class="cart-footer">

            <h3>
                Total:
                ₹<span id="cartTotal">0</span>
            </h3>

            <button
                class="checkout"
                onclick="checkout()">
                CHECKOUT
            </button>

        </div>

    </aside>


    <!-- TOAST -->
    <div id="toast" class="toast"></div>


    <!-- FOOTER -->
    <footer>

        <div class="footer-logo">
            AJIO
        </div>

        <p>
            Fashion. Lifestyle. You.
        </p>

        <p>
            © 2026 AJIO Fashion Store
        </p>

    </footer>


    <script src="script.js"></script>

</body>
</html>
